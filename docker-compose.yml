services:
  server:
    build:
      dockerfile: ./server/Dockerfile
    image: gpulist-server
    container_name: gpulist-server
    networks:
      - network
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    depends_on:
      server:
        condition: service_healthy
    build:
      dockerfile: ./nginx/Dockerfile
    image: gpulist-nginx
    container_name: gpulist-nginx
    networks:
      - network
    ports:
      - 8000:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  network:
    driver: bridge
