services:
  webapp-server:
    build:
      dockerfile: ./server/Dockerfile
    container_name: gpulist-webapp-server
    networks:
      - webapp-network
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  webapp-nginx:
    depends_on:
      webapp-server:
        condition: service_healthy
    build:
      dockerfile: ./nginx/Dockerfile
    container_name: gpulist-webapp-nginx
    networks:
      - webapp-network
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  webapp-network:
    driver: bridge
