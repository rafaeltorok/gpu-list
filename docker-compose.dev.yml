services:
  dev-mongodb:
    image: mongo
    container_name: gpulist-dev-mongodb
    ports:
      - 3456:27017
    networks:
      - dev-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=gpulist
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=gpus
    volumes:
      - ./mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-server:
    depends_on:
      dev-mongodb:
        condition: service_healthy
    build:
      context: ./
      dockerfile: ./server/Dockerfile.dev
    container_name: gpulist-dev-server
    networks:
      - dev-network
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://gpulist:password@dev-mongodb:27017/gpus
    volumes:
      - ./server:/usr/src/app/server
      - /usr/src/app/server/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-client:
    depends_on:
      dev-server:
        condition: service_healthy
    container_name: gpulist-dev-client
    build:
      context: ./
      dockerfile: ./client/Dockerfile.dev
    networks:
      - dev-network
    ports:
      - "5173:5173"
    volumes:
      - ./client:/usr/src/app/client
      - /usr/src/app/client/node_modules
    environment:
      - VITE_SERVER_URL=http://dev-server:3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-alt-client:
    depends_on:
      dev-server:
        condition: service_healthy
    container_name: gpulist-dev-alt-client
    build:
      context: ./
      dockerfile: ./alternative-client/Dockerfile.dev
    networks:
      - dev-network
    ports:
      - "5174:5173"
    volumes:
      - ./alternative-client:/usr/src/app/alt-client
      - /usr/src/app/alt-client/node_modules
    environment:
      - VITE_SERVER_URL=http://dev-server:3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dev-network:
    driver: bridge
