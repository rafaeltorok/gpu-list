services:
  dev-mongodb:
    image: mongo
    container_name: gpulist-dev-mongodb
    networks:
      - dev-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=gpulist
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=gpus
    volumes:
      - ./mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-server:
    depends_on:
      dev-mongodb:
        condition: service_healthy
    build:
      context: ./
      dockerfile: ./server/Dockerfile.dev
    image: gpulist-dev-server
    container_name: gpulist-dev-server
    networks:
      - dev-network
    environment:
      - MONGODB_URI=mongodb://gpulist:password@dev-mongodb:27017/gpus
    volumes:
      - ./server:/usr/src/app/server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-client:
    depends_on:
      dev-server:
        condition: service_healthy
    build:
      context: ./
      dockerfile: ./client/Dockerfile.dev
    image: gpulist-dev-client
    container_name: gpulist-dev-client
    networks:
      - dev-network
    volumes:
      - ./client:/usr/src/app/client
    environment:
      - VITE_SERVER_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-alt-client:
    depends_on:
      dev-server:
        condition: service_healthy
    build:
      context: ./
      dockerfile: ./alternative-client/Dockerfile.dev
    image: gpulist-dev-alt-client
    container_name: gpulist-dev-alt-client
    networks:
      - dev-network
    volumes:
      - ./alternative-client:/usr/src/app/alt-client
    environment:
      - VITE_SERVER_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dev-nginx:
    depends_on:
      dev-server:
        condition: service_healthy
      dev-client:
        condition: service_healthy
      dev-alt-client:
        condition: service_healthy
    image: nginx:stable-alpine
    container_name: gpulist-dev-nginx
    ports:
      - 8000:80
    networks:
      - dev-network
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dev-network:
    driver: bridge
