services:
  webapp-server:
    build: ./server
    container_name: gpulist-webapp-server
    networks:
      - webapp-network
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: test

  webapp-client:
    build: ./client
    container_name: gpulist-webapp-client
    networks:
      - webapp-network
    ports:
      - "5173:80"
    depends_on:
      - webapp-server

  webapp-cypress:
    build: ./e2e
    working_dir: /e2e
    networks:
      - webapp-network
    env_file:
      - ./e2e/.docker.env
    depends_on:
      - webapp-server
      - webapp-client

networks:
  webapp-network:
    driver: bridge
