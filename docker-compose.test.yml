services:
  test-mongodb:
    image: mongo
    container_name: gpulist-test-mongodb
    networks:
      - test-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=gpulist
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=test_gpus
    volumes:
      - ./mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  test-server:
    depends_on:
      test-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    build: 
      context: ./
      dockerfile: ./server/Dockerfile
    image: gpulist-server
    container_name: gpulist-test-server
    networks:
      - test-network
    environment:
      # authSource=admin tells the MongoDB driver to authenticate against the admin database where
      # root credentials are created, preventing a "not authorized to execute command" error
      - MAIN_E2E_MONGODB_URI=mongodb://gpulist:password@test-mongodb:27017/test_gpus?authSource=admin
      - NODE_ENV=main-e2e

  test-nginx:
    depends_on:
      test-server:
        condition: service_healthy
    build:
      dockerfile: ./nginx/Dockerfile.test
    image: gpulist-nginx
    container_name: gpulist-test-nginx
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  test-e2e:
    depends_on:
      test-nginx:
        condition: service_healthy
    build: 
      context: ./
      dockerfile: ./e2e/Dockerfile
    image: gpulist-e2e
    container_name: gpulist-test-e2e
    working_dir: /e2e
    networks:
      - test-network
    command: npm run e2e:all

networks:
  test-network:
    driver: bridge
