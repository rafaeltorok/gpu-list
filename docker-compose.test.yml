services:
  server:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    build: 
      context: ./
      dockerfile: ./server/Dockerfile
    image: gpulist-server
    container_name: gpulist-server
    networks:
      - test-network
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: e2e

  nginx:
    depends_on:
      server:
        condition: service_healthy
    build:
      dockerfile: ./nginx/Dockerfile
    image: gpulist-nginx
    container_name: gpulist-nginx
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  e2e:
    depends_on:
      nginx:
        condition: service_healthy
    build: 
      context: ./
      dockerfile: ./e2e/Dockerfile
    image: gpulist-e2e
    container_name: gpulist-e2e
    working_dir: /e2e
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
