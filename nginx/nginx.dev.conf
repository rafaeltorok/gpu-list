server {
  listen 80;

  # Redirect /alt → /alt/ (preserve port)
  location = /alt {
    return 301 $scheme://$http_host/alt/;
  }

  # Serve the main client static build
  location / {
    proxy_pass http://dev-client:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Serve the alt client static build
  location /alt/ {
    proxy_pass http://dev-alt-client:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Proxy API requests to backend container
  location /api/ {
    proxy_pass http://dev-server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
